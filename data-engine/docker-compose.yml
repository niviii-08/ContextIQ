version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Points at the bundled local Postgres by default. Swap this for a
      # Supabase connection string to run against a hosted database instead,
      # and remove/ignore the `db` service below.
      DATABASE_URL: postgresql+psycopg2://contextiq:contextiq@db:5432/contextiq
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contextiq
      POSTGRES_PASSWORD: contextiq
      POSTGRES_DB: contextiq
    ports:
      - "5432:5432"
    volumes:
      - contextiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  contextiq_pgdata:
